<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mentore Solution - Job Popup Demo</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 200vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 193, 7, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #0c0c0c,
                    #292929
                );

            color: #ffffff;

            overflow-x: hidden;
        }


        /* =====================================================
           DEMO WEBSITE
        ===================================================== */

        .demo {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }


        .demo-content {

            max-width: 700px;
        }


        .demo h1 {

            color: #ffc107;

            font-size:
                clamp(
                    32px,
                    9vw,
                    56px
                );

            margin-bottom: 15px;
        }


        .demo p {

            color: #bdbdbd;

            line-height: 1.7;

            font-size: 15px;

            margin-bottom: 8px;
        }


        .demo-section {

            min-height: 70vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        .demo-section h2 {

            color: #ffc107;

            font-size: 28px;
        }



        /* =====================================================
           JOB POPUP
        ===================================================== */

        .job-popup {

            position: fixed;

            width: 118px;

            height: 38px;

            z-index: 999999;

            display: flex;

            align-items: center;

            justify-content: center;


            background:
                linear-gradient(
                    135deg,
                    #1b1b1b,
                    #090909
                );


            border:
                1px solid
                rgba(
                    255,
                    193,
                    7,
                    0.9
                );


            border-radius: 10px;


            box-shadow:

                0 6px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                ),

                0 0 15px
                rgba(
                    255,
                    193,
                    7,
                    0.16
                );


            opacity: 0;

            visibility: hidden;

            pointer-events: none;


            transform:
                translate3d(
                    0,
                    10px,
                    0
                );


            transition:

                opacity
                0.3s ease,

                transform
                0.4s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                ),

                visibility
                0.3s ease;
        }


        /* =====================================================
           YELLOW ACCENT
        ===================================================== */

        .job-popup::before {

            content: "";

            position: absolute;

            left: 0;

            top: 7px;

            bottom: 7px;

            width: 3px;

            background: #ffc107;

            border-radius:
                0 3px 3px 0;

            box-shadow:
                0 0 7px
                rgba(
                    255,
                    193,
                    7,
                    0.6
                );
        }


        /* =====================================================
           SHOW
        ===================================================== */

        .job-popup.show {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            transform:
                translate3d(
                    0,
                    0,
                    0
                );
        }



        /* =====================================================
           TOP LEFT
        ===================================================== */

        .job-popup.top-left {

            top:
                calc(
                    18px +
                    env(
                        safe-area-inset-top
                    )
                );

            left: 10px;
        }



        /* =====================================================
           TOP RIGHT
        ===================================================== */

        .job-popup.top-right {

            top:
                calc(
                    18px +
                    env(
                        safe-area-inset-top
                    )
                );

            right: 10px;
        }



        /* =====================================================
           MIDDLE LEFT
        ===================================================== */

        .job-popup.middle-left {

            top: 50%;

            left: 8px;

            transform:
                translate3d(
                    -10px,
                    -50%,
                    0
                );
        }


        .job-popup.middle-left.show {

            transform:
                translate3d(
                    0,
                    -50%,
                    0
                );
        }



        /* =====================================================
           MIDDLE RIGHT
        ===================================================== */

        .job-popup.middle-right {

            top: 50%;

            right: 8px;

            transform:
                translate3d(
                    10px,
                    -50%,
                    0
                );
        }


        .job-popup.middle-right.show {

            transform:
                translate3d(
                    0,
                    -50%,
                    0
                );
        }



        /* =====================================================
           BOTTOM RIGHT
        ===================================================== */

        .job-popup.bottom-right {

            right: 10px;

            bottom:
                calc(
                    18px +
                    env(
                        safe-area-inset-bottom
                    )
                );
        }



        /* =====================================================
           JOB BUTTON
        ===================================================== */

        .job-button {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: #ffffff;

            font-size: 11px;

            font-weight: 700;

            letter-spacing:
                0.25px;

            white-space: nowrap;

            -webkit-tap-highlight-color:
                transparent;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }


        .job-text {

            position: relative;

            z-index: 2;
        }


        .job-button:hover {

            color: #ffc107;
        }


        .job-button:active {

            transform:
                scale(0.96);
        }



        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        .job-close {

            position: absolute;

            top: -7px;

            right: -7px;

            width: 17px;

            height: 17px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background: #ffc107;

            color: #111111;

            font-size: 11px;

            font-weight: 800;

            line-height: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            z-index: 5;

            box-shadow:
                0 2px 7px
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );

            -webkit-tap-highlight-color:
                transparent;
        }


        .job-close:hover {

            background: #ffd54f;
        }


        .job-close:active {

            transform:
                scale(0.9);
        }



        /* =====================================================
           MOBILE ONLY
        ===================================================== */

        @media (min-width: 769px) {

            .job-popup {

                display: none !important;

            }

        }



        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            .job-popup {

                width: 108px;

                height: 35px;

            }


            .job-button {

                font-size: 10px;

            }

        }



        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            .job-popup {

                transition:
                    opacity 0.2s ease;

            }

        }

    </style>

</head>

    <!-- =====================================================
         DEMO WEBSITE
    ===================================================== -->

    <section class="demo">

        <div class="demo-content">

            <h1>
                Mentore Solution
            </h1>

            <p>
                Professional Job Popup Demo
            </p>

            <p>
                The popup appears automatically on mobile.
            </p>

        </div>

    </section>


    <section class="demo-section">

        <h2>
            Career Opportunities
        </h2>

    </section>


    <!-- =====================================================
         JOB POPUP
    ===================================================== -->

    <div
        id="jobPopup"
        class="job-popup"
        aria-hidden="true"
    >


        <!-- CLOSE -->

        <button
            type="button"
            id="jobClose"
            class="job-close"
            aria-label="Close popup"
        >
            ×
        </button>


        <!-- GET ME A JOB -->

        <a
            href="#"
            id="jobButton"
            class="job-button"
            aria-label="Get Me a Job"
        >

            <span class="job-text">
                Get Me a Job
            </span>

        </a>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   ELEMENTS
                ================================================= */

                const popup =
                    document.getElementById(
                        "jobPopup"
                    );


                const closeButton =
                    document.getElementById(
                        "jobClose"
                    );


                const jobButton =
                    document.getElementById(
                        "jobButton"
                    );



                /* =================================================
                   TEST WHATSAPP NUMBER
                ================================================= */

                /*
                   Test number.

                   Replace with your real number
                   before using this on your website.

                   Example India:

                   919876543210
                */

                const whatsappNumber =
                    "15551234567";


                const whatsappMessage =
                    "Hello Mentore Solution, I am interested in job opportunities. Please share the available openings and application details.";



                /* =================================================
                   TIMING
                ================================================= */

                /*
                   FIRST APPEARANCE:
                   0.5 – 1 second

                   VISIBLE:
                   4 seconds

                   WAIT:
                   6 seconds

                   THEN REPEAT
                */

                const MIN_DELAY = 500;

                const MAX_DELAY = 1000;

                const VISIBLE_TIME = 4000;

                const WAIT_TIME = 6000;



                /* =================================================
                   RANDOM POSITIONS
                ================================================= */

                const positions = [

                    "top-left",

                    "top-right",

                    "middle-left",

                    "middle-right",

                    "bottom-right"

                ];



                /* =================================================
                   TIMERS
                ================================================= */

                let showTimer = null;

                let hideTimer = null;

                let nextTimer = null;



                /* =================================================
                   MOBILE CHECK
                ================================================= */

                function isMobile() {

                    return window.matchMedia(
                        "(max-width: 768px)"
                    ).matches;

                }



                /* =================================================
                   RANDOM DELAY
                ================================================= */

                function randomDelay() {

                    return Math.floor(

                        Math.random() *
                        (
                            MAX_DELAY -
                            MIN_DELAY +
                            1
                        )

                    ) + MIN_DELAY;

                }



                /* =================================================
                   RANDOM POSITION
                ================================================= */

                function setRandomPosition() {


                    positions.forEach(
                        function (position) {

                            popup.classList.remove(
                                position
                            );

                        }
                    );


                    const randomIndex =
                        Math.floor(
                            Math.random() *
                            positions.length
                        );


                    popup.classList.add(
                        positions[
                            randomIndex
                        ]
                    );

                }



                /* =================================================
                   SHOW POPUP
                ================================================= */

                function showPopup() {

                    if (!isMobile()) {

                        return;

                    }


                    setRandomPosition();


                    popup.classList.add(
                        "show"
                    );


                    popup.setAttribute(
                        "aria-hidden",
                        "false"
                    );


                    clearTimeout(
                        hideTimer
                    );


                    hideTimer =
                        setTimeout(
                            function () {

                                hidePopup();

                            },
                            VISIBLE_TIME
                        );

                }



                /* =================================================
                   HIDE POPUP
                ================================================= */

                function hidePopup() {

                    popup.classList.remove(
                        "show"
                    );


                    popup.setAttribute(
                        "aria-hidden",
                        "true"
                    );


                    clearTimeout(
                        nextTimer
                    );


                    nextTimer =
                        setTimeout(
                            function () {

                                schedulePopup();

                            },
                            WAIT_TIME
                        );

                }



                /* =================================================
                   SCHEDULE POPUP
                ================================================= */

                function schedulePopup() {

                    if (!isMobile()) {

                        return;

                    }


                    clearTimeout(
                        showTimer
                    );


                    showTimer =
                        setTimeout(
                            function () {

                                showPopup();

                            },
                            randomDelay()
                        );

                }



                /* =================================================
                   CLOSE BUTTON
                ================================================= */

                closeButton.addEventListener(
                    "click",
                    function () {


                        clearTimeout(
                            hideTimer
                        );


                        clearTimeout(
                            nextTimer
                        );


                        popup.classList.remove(
                            "show"
                        );


                        popup.setAttribute(
                            "aria-hidden",
                            "true"
                        );


                        nextTimer =
                            setTimeout(
                                function () {

                                    schedulePopup();

                                },
                                WAIT_TIME
                            );

                    }
                );



                /* =================================================
                   WHATSAPP REDIRECT
                ================================================= */

                jobButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();


                        const message =
                            encodeURIComponent(
                                whatsappMessage
                            );


                        const whatsappURL =
                            "https://wa.me/" +
                            whatsappNumber +
                            "?text=" +
                            message;


                        window.location.href =
                            whatsappURL;

                    }
                );



                /* =================================================
                   DESKTOP CHECK
                ================================================= */

                window.addEventListener(
                    "resize",
                    function () {

                        if (!isMobile()) {


                            clearTimeout(
                                showTimer
                            );


                            clearTimeout(
                                hideTimer
                            );


                            clearTimeout(
                                nextTimer
                            );


                            popup.classList.remove(
                                "show"
                            );


                            popup.setAttribute(
                                "aria-hidden",
                                "true"
                            );

                        }

                    }
                );



                /* =================================================
                   START
                ================================================= */

                schedulePopup();

            }
        );

    </script>

</body>

</html>
